name: APK derle
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Derle
        run: |
          echo "sdk.dir=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true
          npm ci
          npx cap add android
          node patch-android.js
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../HatHizSayaci.apk
      - name: APK'yı yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" HatHizSayaci.apk --title "Hat Hız Sayacı v${{ github.run_number }}" --notes "Telefona indirip açın."
